[package]
name = "craik-tui-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
terminal-colorsaurus = "1.0.3"

[dev-dependencies]
insta = "1"
