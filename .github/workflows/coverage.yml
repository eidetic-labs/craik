name: Coverage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Generate coverage reports
        run: |
          pytest --cov=craik \
            --cov-report=term \
            --cov-report=html \
            --cov-report=xml \
            --cov-fail-under=80
      - name: Generate coverage badge
        run: |
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("coverage.xml").getroot()
          percent = round(float(root.attrib["line-rate"]) * 100)
          color = "brightgreen" if percent >= 90 else "green" if percent >= 80 else "yellow" if percent >= 70 else "orange" if percent >= 60 else "red"
          svg_color = {
              "brightgreen": "#4c1",
              "green": "#97ca00",
              "yellow": "#dfb317",
              "orange": "#fe7d37",
              "red": "#e05d44",
          }[color]
          label = "coverage"
          value = f"{percent}%"
          badge = {
              "schemaVersion": 1,
              "label": label,
              "message": value,
              "color": color,
          }
          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" role="img" aria-label="{label}: {value}">
            <title>{html.escape(label)}: {html.escape(value)}</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r"><rect width="112" height="20" rx="3" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="64" height="20" fill="#555"/>
              <rect x="64" width="48" height="20" fill="{svg_color}"/>
              <rect width="112" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
              <text aria-hidden="true" x="325" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="540">coverage</text>
              <text x="325" y="140" transform="scale(.1)" fill="#fff" textLength="540">coverage</text>
              <text aria-hidden="true" x="875" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="300">{html.escape(value)}</text>
              <text x="875" y="140" transform="scale(.1)" fill="#fff" textLength="300">{html.escape(value)}</text>
            </g>
          </svg>
          """
          Path("htmlcov/coverage-badge.json").write_text(json.dumps(badge, sort_keys=True) + "\n", encoding="utf-8")
          Path("htmlcov/coverage-badge.svg").write_text(svg, encoding="utf-8")
          PY
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: craik-coverage
          path: |
            htmlcov/
            coverage.xml
      - name: Attach coverage.xml to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" coverage.xml --clobber
