name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'
            contracts:
              - 'src/craik/contracts/**'
              - 'tests/fixtures/contracts/**'
              - 'tests/test_contracts.py'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'CHANGELOG.md'
            workflows:
              - '.github/workflows/**'

  changed-file-strictness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check changed-file strictness
        run: python scripts/check_changed_file_strictness.py

  lint:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .

  type:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Type check
        run: mypy

  unit:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: |
          mkdir -p reports/tests reports/coverage
          pytest --junitxml=reports/tests/unit.xml --cov=craik --cov-report=xml:reports/coverage/coverage.xml --cov-report=term
      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-coverage
          path: |
            reports/tests/unit.xml
            reports/coverage/coverage.xml
          retention-days: 14

  contract:
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run contract tests
        run: |
          mkdir -p reports/tests
          pytest tests/test_contracts.py --junitxml=reports/tests/contracts.xml
      - name: Write conformance report
        run: python scripts/write_conformance_report.py
      - name: Upload conformance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-conformance
          path: |
            reports/tests/contracts.xml
            reports/conformance/contracts.json
            reports/conformance/contracts.md
          retention-days: 14

  integration:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run recorded integration tests
        run: pytest -m "integration and not live" tests/integration

  security:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install security audit tooling
        run: python -m pip install pip-audit==2.9.0 bandit==1.8.3
      - name: Audit locked Python dependencies
        run: |
          mkdir -p reports/security
          uv export --locked --format requirements.txt --all-groups --no-emit-project --output-file reports/security/requirements-audit.txt
          pip-audit --requirement reports/security/requirements-audit.txt --require-hashes --disable-pip --progress-spinner off
      - name: Run Bandit static analysis
        run: bandit -r src/craik --baseline .bandit-baseline.json
      - name: Run Gitleaks secret scan
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml --no-git --redact --verbose
      - name: Run policy test baseline
        run: craik policy test
      - name: Check release readiness
        run: python scripts/check_release_readiness.py
      - name: Check CommandResult return annotations
        run: python scripts/check_command_result_return.py
      - name: Check direct stdout in migrated commands
        run: python scripts/check_no_direct_stdout.py
      - name: Check slash command registry
        run: python scripts/check_slash_command_registry.py
      - name: Check dock-bottom snapshot coverage
        run: python scripts/check_dock_bottom_snapshot_coverage.py
      - name: Check text selection wiring
        run: python scripts/check_text_selection_wiring.py
      - name: Check OAuth callback safety
        run: python scripts/check_oauth_callback_safety.py
      - name: Check dead code
        run: python scripts/check_dead_code.py
      - name: Check release version consistency
        run: python scripts/check_release_version.py
      - name: Enforce file size budget
        run: find src -name "*.py" -print0 | xargs -0 python scripts/check_max_file_lines.py
      - name: Check public docs hygiene
        run: python scripts/check_public_docs_hygiene.py

  quickstart-smoke:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run quickstart smoke
        run: python scripts/quickstart_smoke.py

  quality:
    needs:
      - changed-file-strictness
      - lint
      - type
      - unit
      - contract
      - integration
      - security
      - quickstart-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check split quality gates
        run: |
          for result in \
            "${{ needs.changed-file-strictness.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.type.result }}" \
            "${{ needs.unit.result }}" \
            "${{ needs.contract.result }}" \
            "${{ needs.integration.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.quickstart-smoke.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required quality gate finished with result: $result"; exit 1 ;;
            esac
          done
